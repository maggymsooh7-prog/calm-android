
name: Build Calm APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Calm project
        run: |
          unzip -q CalmAndroidProject.zip -d extracted
          test -f extracted/CalmAndroid/app/build.gradle

      - name: Build debug APK
        working-directory: extracted/CalmAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calm-debug-apk
          path: extracted/CalmAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
